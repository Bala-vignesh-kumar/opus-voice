<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --text:#eef0f2; --soft:#a7adb6; --faint:#6b717b;
      --you:#7fb3ff; --opus:#8fd9a8; --amber:#e0b473;
    }
    body{margin:0;background:#0b0d10;color:var(--text);
      font:15.5px/1.65 ui-sans-serif,-apple-system,"SF Pro Text",system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;}
    a{color:var(--you);text-decoration:none} a:hover{text-decoration:underline}

    /* The same ground as the library screen, lit harder from the centre — the
       room is being listened to, and the light should come off the form. */
    .s{position:relative;width:1440px;height:900px;overflow:hidden;
      background:
        radial-gradient(58% 50% at 50% 38%, rgba(143,217,168,.19), transparent 72%),
        radial-gradient(46% 40% at 14% 84%, rgba(127,179,255,.09), transparent 74%),
        radial-gradient(80% 70% at 50% 42%, #1a2027 0%, #101419 55%, #0b0d10 100%);}

    .glass{
      border-radius:28px;
      background:linear-gradient(180deg, rgba(255,255,255,.11), rgba(255,255,255,.035) 34%, rgba(255,255,255,.018) 100%);
      -webkit-backdrop-filter:blur(34px) saturate(1.7);
      backdrop-filter:blur(34px) saturate(1.7);
      box-shadow:
        inset 0 1.2px 0 rgba(255,255,255,.26),
        inset 0 0 0 1px rgba(255,255,255,.055),
        inset 0 -24px 44px rgba(0,0,0,.20),
        0 28px 70px rgba(0,0,0,.44),
        0 3px 10px rgba(0,0,0,.26);}

    .mark{position:absolute;top:40px;left:44px;display:flex;align-items:center;gap:9px;
      font-size:13.5px;color:var(--soft);letter-spacing:-0.005em;}
    .mark .d{width:6px;height:6px;border-radius:50%;background:var(--opus);
      box-shadow:0 0 10px rgba(143,217,168,.9);animation:blip 2.2s ease-in-out infinite;}
    @keyframes blip{0%,100%{opacity:.5}50%{opacity:1}}

    .state{position:absolute;top:36px;right:44px;padding:8px 18px;border-radius:999px;
      font-size:13.5px;color:var(--opus);display:flex;align-items:center;gap:9px;
      background:linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.20), inset 0 0 0 1px rgba(143,217,168,.14),
                 0 3px 10px rgba(0,0,0,.28);}
    .state .d{width:6px;height:6px;border-radius:50%;background:var(--opus);
      box-shadow:0 0 10px rgba(143,217,168,.9);animation:blip 1.4s ease-in-out infinite;}

    /* ----------------------------------------------------------- centre */

    .stage{position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;padding-bottom:60px;}

    .orb{position:relative;width:440px;height:440px;display:grid;place-items:center;}
    .halo{position:absolute;width:440px;height:440px;border-radius:50%;
      background:radial-gradient(closest-side, rgba(143,217,168,.24), rgba(143,217,168,.06) 60%, transparent 76%);
      filter:blur(6px);animation:breathe 2.4s ease-in-out infinite;}
    @keyframes breathe{0%,100%{opacity:.72;transform:scale(.97)}50%{opacity:1;transform:scale(1.05)}}
    .swarm{width:380px;height:380px;animation:spin 34s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .swarm circle.d{animation:flick 2.2s ease-in-out infinite;}
    @keyframes flick{0%,100%{opacity:.16}50%{opacity:1}}
    .core{animation:core 2.1s ease-in-out infinite;}
    @keyframes core{0%,100%{opacity:.5}50%{opacity:1}}

    /* Provisional text stays italic and stays on the open ground. A surface
       behind it would make a guess look like a finished turn. */
    .interim{max-width:940px;margin-top:16px;text-align:center;
      font-size:31px;line-height:1.42;font-weight:300;font-style:italic;
      letter-spacing:-0.018em;color:var(--text);}
    .caret{display:inline-block;width:2px;height:0.88em;margin-left:7px;background:var(--opus);
      vertical-align:-0.07em;animation:blink 1.05s steps(1) infinite;}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

    /* ------------------------------------------------------------- dock */

    /* One surface at the bottom holding everything the screen still owes you:
       what was just said, how loud you are, and how to type instead. */
    .dock{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);
      width:960px;padding:16px 20px;display:flex;align-items:center;gap:20px;}

    .turn{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
    .turn .who{font-size:12px;color:var(--faint);}
    .turn .tx{font-size:13.5px;line-height:1.45;color:var(--soft);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

    .lvl{display:flex;align-items:flex-end;gap:3px;height:26px;width:132px;flex:none;}
    .lvl i{flex:1;display:block;border-radius:2px;
      background:linear-gradient(to top, rgba(143,217,168,.28), rgba(143,217,168,.95));
      animation:jump 1.1s ease-in-out infinite;transform-origin:bottom;}
    @keyframes jump{0%,100%{transform:scaleY(.24)}50%{transform:scaleY(1)}}

    .div{width:1px;height:34px;background:rgba(255,255,255,.075);flex:none;}

    .type{flex:none;padding:9px 18px;border-radius:999px;font-size:13.5px;color:var(--faint);
      background:rgba(255,255,255,.05);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.10), inset 0 0 0 1px rgba(255,255,255,.045);}

    @media (prefers-reduced-motion: reduce){*{animation:none !important}}
  </style>
</helmet>
<div class="s">
  <div class="mark">
    <span class="d"></span>
    <span>opus voice</span>
  </div>

  <div class="state">
    <span class="d"></span>
    <span>Listening</span>
  </div>

  <div class="stage">
    <div class="orb">
      <div class="halo"></div>
      <svg class="swarm" viewBox="0 0 260 260" fill="none" aria-hidden="true">
        <circle class="core" cx="130" cy="130" r="34" fill="rgba(143,217,168,0.14)"></circle>
        <circle class="core" cx="130" cy="130" r="34" stroke="rgba(143,217,168,0.28)" stroke-width="1"></circle>
        <sc-for list="{{dots}}" as="d" hint-placeholder-count="40">
          <circle class="d" cx="{{d.cx}}" cy="{{d.cy}}" r="{{d.r}}" fill="rgba(143,217,168,0.9)"
            opacity="{{d.o}}" style="animation-delay: {{d.delay}}s"></circle>
        </sc-for>
      </svg>
    </div>

    <div class="interim">can you show me where that's configured<span class="caret"></span></div>
  </div>

  <div class="glass dock">
    <div class="turn">
      <span class="who">opus</span>
      <span class="tx">It's the cache — it's rebuilding from scratch every run.</span>
    </div>

    <div class="div"></div>

    <div class="lvl">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="16">
        <i style="animation-delay: {{b.delay}}s; opacity: {{b.o}}"></i>
      </sc-for>
    </div>

    <div class="div"></div>

    <div class="type">Type instead…</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    let s = 55021;
    const rnd = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296;
    const dots = [];
    for (let i = 0; i < 130; i++) {
      const a = i * 2.39996;
      const band = 48 + rnd() * 40 + 0.8 * 46 * rnd();
      dots.push({
        cx: (130 + Math.cos(a) * band).toFixed(1),
        cy: (130 + Math.sin(a) * band).toFixed(1),
        r: (0.6 + rnd() * 1.7).toFixed(2),
        o: (0.14 + rnd() * 0.58).toFixed(2),
        delay: (rnd() * 2.2).toFixed(2),
      });
    }
    const bars = [];
    for (let i = 0; i < 18; i++) {
      bars.push({ delay: (rnd() * 1.1).toFixed(2), o: (0.5 + rnd() * 0.5).toFixed(2) });
    }
    return { dots, bars };
  }
}
</script>
</body>
</html>
