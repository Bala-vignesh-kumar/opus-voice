<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{--bg:#0d0e11;--text:#e7e8ea;--soft:#9aa0aa;--faint:#5d636e;--opus:#8fd9a8;--you:#7fb3ff;}
    body{margin:0;background:var(--bg);color:var(--text);
      font:15.5px/1.65 ui-sans-serif,-apple-system,"SF Pro Text",system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;}
    a{color:var(--you);text-decoration:none} a:hover{text-decoration:underline}

    .s{position:relative;width:720px;height:450px;overflow:hidden;
      background:radial-gradient(120% 100% at 50% 42%, #11161a 0%, #0d0e11 60%, #090a0d 100%);
      display:grid;place-items:center;}

    .meter{width:300px;height:300px;}
    .bars{transform-origin:130px 130px;animation:turn 70s linear infinite;}
    @keyframes turn{to{transform:rotate(360deg)}}
    .bars line{animation:bar 1.9s ease-in-out infinite;transform-origin:130px 130px;}
    @keyframes bar{0%,100%{opacity:.30}50%{opacity:1}}
    .guide{animation:guide 5s ease-in-out infinite;}
    @keyframes guide{0%,100%{opacity:.5}50%{opacity:.85}}

    .cap{position:absolute;left:28px;bottom:24px;display:flex;flex-direction:column;gap:3px;}
    .cap .n{font-size:14px;font-weight:600;letter-spacing:-0.005em;color:var(--text);}
    .cap .t{font-size:12.5px;color:var(--faint);max-width:350px;}
    .tag{position:absolute;right:28px;bottom:26px;font-size:11.5px;letter-spacing:0.06em;
      text-transform:uppercase;color:var(--faint);}

    @media (prefers-reduced-motion: reduce){*{animation:none !important}}
  </style>
</helmet>
<div class="s">
  <svg class="meter" viewBox="0 0 260 260" fill="none" aria-hidden="true">
    <circle class="guide" cx="130" cy="130" r="62" stroke="rgba(143,217,168,0.16)" stroke-width="1"></circle>
    <circle class="guide" cx="130" cy="130" r="44" stroke="rgba(143,217,168,0.10)" stroke-width="1"></circle>
    <g class="bars">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="48">
        <line x1="{{b.x1}}" y1="{{b.y1}}" x2="{{b.x2}}" y2="{{b.y2}}"
          stroke="rgba(143,217,168,0.9)" stroke-width="1.4" stroke-linecap="round"
          opacity="{{b.o}}" style="animation-delay: {{b.delay}}s"></line>
      </sc-for>
    </g>
  </svg>

  <div class="cap">
    <div class="n">C · Concentric waveform</div>
    <div class="t">Precise and instrument-like — it reads as a meter rather than a creature. Most honest about what it is showing, and the least calm to sit under all day.</div>
  </div>
  <div class="tag">Direction C</div>
</div>
</x-dc>
<script data-dc-script data-props='{"energy":{"editor":"range","default":0.45,"min":0,"max":1,"step":0.05,"section":"Amplitude","tsType":"number"},"$preview":{"width":720,"height":450}}'>
class Component extends DCLogic {
  renderVals() {
    const e = this.props.energy ?? 0.45;
    let s = 7331;
    const rnd = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296;
    const bars = [];
    const N = 96;
    const R = 66;
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2 - Math.PI / 2;
      const len = 5 + rnd() * 8 + e * (8 + rnd() * 46);
      bars.push({
        x1: (130 + Math.cos(a) * R).toFixed(1),
        y1: (130 + Math.sin(a) * R).toFixed(1),
        x2: (130 + Math.cos(a) * (R + len)).toFixed(1),
        y2: (130 + Math.sin(a) * (R + len)).toFixed(1),
        o: (0.26 + rnd() * 0.6).toFixed(2),
        delay: (rnd() * 1.9).toFixed(2),
      });
    }
    return { bars };
  }
}
</script>
</body>
</html>
