<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{--bg:#0d0e11;--text:#e7e8ea;--soft:#9aa0aa;--faint:#5d636e;--opus:#8fd9a8;--you:#7fb3ff;}
    body{margin:0;background:var(--bg);color:var(--text);
      font:15.5px/1.65 ui-sans-serif,-apple-system,"SF Pro Text",system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;}
    a{color:var(--you);text-decoration:none} a:hover{text-decoration:underline}

    .s{position:relative;width:720px;height:450px;overflow:hidden;
      background:radial-gradient(120% 100% at 50% 42%, #12171a 0%, #0d0e11 60%, #090a0d 100%);
      display:grid;place-items:center;}

    .field{position:relative;width:300px;height:300px;display:grid;place-items:center;}
    .ring{position:absolute;width:196px;height:196px;border-radius:50%;
      border:1px solid rgba(143,217,168,.32);}
    .r1{animation:ripple 3.0s ease-out infinite;}
    .r2{animation:ripple 3.0s ease-out infinite 1.0s;}
    .r3{animation:ripple 3.0s ease-out infinite 2.0s;}
    @keyframes ripple{
      0%{transform:scale(.98);opacity:.55}
      100%{transform:scale(calc(1.20 + var(--e) * .55));opacity:0}
    }
    .liquid{position:relative;width:196px;height:196px;border-radius:50%;overflow:hidden;
      background:radial-gradient(78% 78% at 50% 40%, rgba(143,217,168,.20), rgba(143,217,168,.05) 62%, rgba(0,0,0,0) 100%), #101519;
      box-shadow:0 0 0 1px rgba(143,217,168,.24), 0 0 96px 12px rgba(143,217,168,.15),
                 inset 0 0 56px rgba(143,217,168,.10);
      transform:scale(calc(1 + var(--e) * .10));}
    .liquid i{position:absolute;display:block;border-radius:50%;filter:blur(24px);}
    .b1{width:126px;height:126px;left:12px;top:20px;background:rgba(143,217,168,.40);animation:drift1 6s ease-in-out infinite;}
    .b2{width:100px;height:100px;right:8px;top:62px;background:rgba(143,217,168,.28);animation:drift2 8s ease-in-out infinite;}
    .b3{width:78px;height:78px;left:58px;bottom:4px;background:rgba(255,255,255,.12);animation:drift3 10s ease-in-out infinite;}
    @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(20px,-14px) scale(1.16)}}
    @keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-17px,15px) scale(.86)}}
    @keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(11px,-17px)}}

    .cap{position:absolute;left:28px;bottom:24px;display:flex;flex-direction:column;gap:3px;}
    .cap .n{font-size:14px;font-weight:600;letter-spacing:-0.005em;color:var(--text);}
    .cap .t{font-size:12.5px;color:var(--faint);max-width:340px;}
    .tag{position:absolute;right:28px;bottom:26px;font-size:11.5px;letter-spacing:0.06em;
      text-transform:uppercase;color:var(--faint);}

    @media (prefers-reduced-motion: reduce){*{animation:none !important}}
  </style>
</helmet>
<div class="s">
  <div class="field" style="--e: {{e}}">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="liquid">
      <i class="b1"></i>
      <i class="b2"></i>
      <i class="b3"></i>
    </div>
  </div>

  <div class="cap">
    <div class="n">A · Liquid orb</div>
    <div class="t">Warm and creature-like. Reads as something present in the room. Cheapest to run — pure CSS, no canvas, no per-frame JS.</div>
  </div>
  <div class="tag">Direction A</div>
</div>
</x-dc>
<script data-dc-script data-props='{"energy":{"editor":"range","default":0.45,"min":0,"max":1,"step":0.05,"section":"Amplitude","tsType":"number"},"$preview":{"width":720,"height":450}}'>
class Component extends DCLogic {
  renderVals() {
    return { e: this.props.energy ?? 0.45 };
  }
}
</script>
</body>
</html>
