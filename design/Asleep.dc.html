<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:#0d0e11; --text:#e7e8ea; --soft:#9aa0aa; --faint:#5d636e;
      --line:#22252c; --opus:#8fd9a8;
    }
    body{margin:0;background:var(--bg);color:var(--text);
      font:15.5px/1.65 ui-sans-serif,-apple-system,"SF Pro Text",system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;}
    a{color:#7fb3ff;text-decoration:none} a:hover{text-decoration:underline}

    .s{position:relative;width:1440px;height:900px;overflow:hidden;
      background:radial-gradient(120% 92% at 50% 42%, #101116 0%, #0d0e11 60%, #08090c 100%);
      display:flex;flex-direction:column;align-items:center;justify-content:center;}

    /* Asleep is the only state with no colour and no outward motion: it must be
       unmistakably different from listening at a glance across a room. */
    .field{position:relative;width:300px;height:300px;display:grid;place-items:center;}
    .swarm{width:300px;height:300px;animation:turn 110s linear infinite;}
    @keyframes turn{to{transform:rotate(360deg)}}
    .swarm circle.d{animation:flick 6.4s ease-in-out infinite;}
    @keyframes flick{0%,100%{opacity:.20}50%{opacity:1}}
    .core{animation:core 5.4s ease-in-out infinite;}
    @keyframes core{0%,100%{opacity:.45}50%{opacity:.85}}

    .status{position:absolute;top:34px;left:50%;transform:translateX(-50%);
      padding:3px 11px;border:1px solid var(--line);border-radius:999px;
      color:var(--soft);font-size:12px;letter-spacing:0.02em;}

    .wake{font-size:19px;color:var(--faint);margin-top:30px;letter-spacing:-0.005em;}
    .wake b{color:var(--soft);font-weight:600;}

    .hint{position:absolute;left:0;right:0;bottom:38px;text-align:center;
      font-size:12.5px;color:var(--faint);opacity:.6;}

    @media (prefers-reduced-motion: reduce){*{animation:none !important}}
  </style>
</helmet>
<div class="s">
  <div class="status">asleep</div>

  <div class="field">
    <svg class="swarm" viewBox="0 0 260 260" fill="none" aria-hidden="true">
      <circle class="core" cx="130" cy="130" r="34" fill="rgba(93,99,110,0.09)"></circle>
      <circle class="core" cx="130" cy="130" r="34" stroke="rgba(93,99,110,0.20)" stroke-width="1"></circle>
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="40">
        <circle class="d" cx="{{d.cx}}" cy="{{d.cy}}" r="{{d.r}}" fill="rgba(93,99,110,0.85)"
          opacity="{{d.o}}" style="animation-delay: {{d.delay}}s"></circle>
      </sc-for>
    </svg>
  </div>

  <p class="wake">Say <b>hey falcon</b> to wake it.</p>

  <div class="hint">the microphone is released — nothing is being heard or written down</div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    let s = 11003;
    const rnd = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296;
    const dots = [];
    for (let i = 0; i < 130; i++) {
      const a = i * 2.39996;
      const band = 48 + rnd() * 40 + 0.06 * 46 * rnd();
      dots.push({
        cx: (130 + Math.cos(a) * band).toFixed(1),
        cy: (130 + Math.sin(a) * band).toFixed(1),
        r: (0.6 + rnd() * 1.7).toFixed(2),
        o: (0.14 + rnd() * 0.58).toFixed(2),
        delay: (rnd() * 6.4).toFixed(2),
      });
    }
    return { dots };
  }
}
</script>
</body>
</html>
