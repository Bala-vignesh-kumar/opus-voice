<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:#0d0e11; --text:#e7e8ea; --soft:#9aa0aa; --faint:#5d636e;
      --line:#22252c; --amber:#e0b473; --ring-note:#4a3d28; --you:#7fb3ff;
    }
    body{margin:0;background:var(--bg);color:var(--text);
      font:15.5px/1.65 ui-sans-serif,-apple-system,"SF Pro Text",system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;}
    a{color:var(--you);text-decoration:none} a:hover{text-decoration:underline}

    .s{position:relative;width:1440px;height:900px;overflow:hidden;
      background:radial-gradient(120% 92% at 50% 30%, #16141a 0%, #0d0e11 58%, #090a0d 100%);
      display:flex;flex-direction:column;align-items:center;justify-content:center;}

    /* Note mode is deliberately the slowest thing on screen. It sits through a
       whole meeting, so anything lively would be exhausting to have in the room. */
    .field{position:relative;width:220px;height:220px;display:grid;place-items:center;}
    /* A near-motionless field: a full rotation outlasts most of the meeting it is
       sitting through, and the dots barely flicker so it never competes for attention. */
    .swarm{width:220px;height:220px;animation:turn 120s linear infinite;}
    @keyframes turn{to{transform:rotate(360deg)}}
    .swarm circle.d{animation:flick 7s ease-in-out infinite;}
    @keyframes flick{0%,100%{opacity:.20}50%{opacity:1}}
    .core{animation:core 5.4s ease-in-out infinite;}
    @keyframes core{0%,100%{opacity:.45}50%{opacity:.85}}

    .status{position:absolute;top:34px;left:50%;transform:translateX(-50%);
      padding:3px 11px;border:1px solid var(--ring-note);border-radius:999px;
      color:var(--amber);font-size:12px;letter-spacing:0.02em;}

    .title{font-size:26px;font-weight:200;letter-spacing:-0.018em;color:var(--soft);
      margin:20px 0 0;}
    .elapsed{font-size:13px;color:var(--faint);margin-top:6px;
      font-variant-numeric:tabular-nums;}

    /* Fragments as they are heard, oldest fading out at the top. Nothing here
       is kept — the file that gets written is the summary, not this. */
    .heard{display:flex;flex-direction:column;align-items:center;gap:6px;
      margin-top:34px;font-size:15px;color:var(--faint);}
    .heard div::before{content:"· ";}
    .heard .f1{opacity:.28}
    .heard .f2{opacity:.45}
    .heard .f3{opacity:.65}
    .heard .f4{opacity:1;color:var(--soft);}

    .hint{position:absolute;left:0;right:0;bottom:38px;text-align:center;
      font-size:12.5px;color:var(--faint);}
    .hint b{color:var(--soft);font-weight:600;}

    @media (prefers-reduced-motion: reduce){*{animation:none !important}}
  </style>
</helmet>
<div class="s">
  <div class="status">taking notes</div>

  <div class="field">
    <svg class="swarm" viewBox="0 0 260 260" fill="none" aria-hidden="true">
      <circle class="core" cx="130" cy="130" r="34" fill="rgba(224,180,115,0.09)"></circle>
      <circle class="core" cx="130" cy="130" r="34" stroke="rgba(224,180,115,0.20)" stroke-width="1"></circle>
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="40">
        <circle class="d" cx="{{d.cx}}" cy="{{d.cy}}" r="{{d.r}}" fill="rgba(224,180,115,0.85)"
          opacity="{{d.o}}" style="animation-delay: {{d.delay}}s"></circle>
      </sc-for>
    </svg>
  </div>

  <div class="title">Listening, not answering.</div>
  <div class="elapsed">18:42 captured</div>

  <div class="heard">
    <div class="f1">so the migration has to land before the release cut</div>
    <div class="f2">can we do it behind a flag instead</div>
    <div class="f3">that's fine if someone owns turning it on</div>
    <div class="f4">let's put it on the board for Thursday</div>
  </div>

  <div class="hint">say <b>hey falcon stop</b> to finish and write the notes</div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    let s = 90210;
    const rnd = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296;
    const dots = [];
    for (let i = 0; i < 130; i++) {
      const a = i * 2.39996;
      const band = 48 + rnd() * 40 + 0.14 * 46 * rnd();
      dots.push({
        cx: (130 + Math.cos(a) * band).toFixed(1),
        cy: (130 + Math.sin(a) * band).toFixed(1),
        r: (0.6 + rnd() * 1.7).toFixed(2),
        o: (0.14 + rnd() * 0.58).toFixed(2),
        delay: (rnd() * 7).toFixed(2),
      });
    }
    return { dots };
  }
}
</script>
</body>
</html>
