<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:#0d0e11; --raised:#15171c; --line:#22252c; --text:#e7e8ea;
      --soft:#9aa0aa; --faint:#5d636e; --you:#7fb3ff; --opus:#8fd9a8;
      --amber:#e0b473; --red:#f08c86; --sunken:#0b0c0f; --edge:#333842;
    }
    body{margin:0;background:var(--bg);color:var(--text);
      font:15.5px/1.65 ui-sans-serif,-apple-system,"SF Pro Text",system-ui,sans-serif;
      -webkit-font-smoothing:antialiased;}
    a{color:var(--you);text-decoration:none} a:hover{text-decoration:underline}

    .s{position:relative;width:1440px;height:900px;overflow:hidden;
      background:radial-gradient(120% 92% at 50% 40%, #13151b 0%, #0d0e11 58%, #090a0d 100%);
      display:flex;flex-direction:column;align-items:center;justify-content:center;}

    .field{position:relative;width:380px;height:380px;display:grid;place-items:center;}
    .swarm{width:380px;height:380px;animation:turn 62s linear infinite;}
    @keyframes turn{to{transform:rotate(360deg)}}
    .swarm circle.d{animation:flick 4.6s ease-in-out infinite;}
    @keyframes flick{0%,100%{opacity:.20}50%{opacity:1}}
    .core{animation:core 5.4s ease-in-out infinite;}
    @keyframes core{0%,100%{opacity:.45}50%{opacity:.85}}

    .headline{font-size:46px;line-height:1.1;font-weight:200;letter-spacing:-0.022em;
      color:var(--text);margin:34px 0 0;}
    .sub{font-size:17px;color:var(--soft);margin:14px 0 0;letter-spacing:-0.005em;}
    .sub b{color:var(--text);font-weight:600;}

    .meta{position:absolute;left:0;right:0;bottom:38px;display:flex;flex-direction:column;
      align-items:center;gap:5px;font-size:12.5px;color:var(--faint);}
    .meta .dirline{color:var(--faint);}
    .meta .dirline em{color:var(--amber);font-style:normal;}

    .hint{position:absolute;top:30px;right:36px;font-size:12px;color:var(--faint);opacity:.55;}
    .hint kbd{font:inherit;color:var(--soft);}

    @media (prefers-reduced-motion: reduce){*{animation:none !important}}
  </style>
</helmet>
<div class="s">
  <div class="hint"><kbd>⌃⌘F</kbd> to leave full screen</div>

  <div class="field">
    <svg class="swarm" viewBox="0 0 260 260" fill="none" aria-hidden="true">
      <circle class="core" cx="130" cy="130" r="34" fill="rgba(143,217,168,0.09)"></circle>
      <circle class="core" cx="130" cy="130" r="34" stroke="rgba(143,217,168,0.20)" stroke-width="1"></circle>
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="40">
        <circle class="d" cx="{{d.cx}}" cy="{{d.cy}}" r="{{d.r}}" fill="rgba(143,217,168,0.85)"
          opacity="{{d.o}}" style="animation-delay: {{d.delay}}s"></circle>
      </sc-for>
    </svg>
  </div>

  <h1 class="headline">I'm ready.</h1>
  <p class="sub">Say <b>hey falcon</b> when you need me.</p>

  <div class="meta">
    <div>opus · piper neural · transcriber on-device en-IN</div>
    <div class="dirline"><em>working in</em> ~/Utils/Random/opus-voice</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    let s = 20260830;
    const rnd = () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296;
    const dots = [];
    for (let i = 0; i < 130; i++) {
      const a = i * 2.39996;
      const band = 48 + rnd() * 40 + 0.20 * 46 * rnd();
      dots.push({
        cx: (130 + Math.cos(a) * band).toFixed(1),
        cy: (130 + Math.sin(a) * band).toFixed(1),
        r: (0.6 + rnd() * 1.7).toFixed(2),
        o: (0.14 + rnd() * 0.58).toFixed(2),
        delay: (rnd() * 4.6).toFixed(2),
      });
    }
    return { dots };
  }
}
</script>
</body>
</html>
