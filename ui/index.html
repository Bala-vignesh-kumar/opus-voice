<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Falcon</title>
<link rel="stylesheet" href="/style.css">
</head>
<body data-view="library">
  <div class="mark">
    <span class="d" id="link-dot" title="connection"></span>
    <span>Falcon</span>
  </div>

  <nav class="glass nav" id="nav">
    <button class="t on" data-view="library">Library</button>
    <button class="t" data-view="today">Today</button>
    <button class="t" data-view="chats">Chats</button>
    <button class="t" data-view="notes">Notes</button>
  </nav>

  <div class="topright">
    <div class="state" id="state">
      <canvas id="field" aria-hidden="true"></canvas>
      <span id="state-label">asleep</span>
    </div>
    <button class="pill" data-cmd="stop">Sleep</button>
  </div>

  <!-- ------------------------------------------------------- library view -->

  <aside class="glass strip" id="meetings" title="No calendar connected yet">
    <span class="label">Upcoming</span>
  </aside>

  <aside class="glass rail right" id="todos" hidden>
    <div class="rh">
      <span class="n">To-do</span>
      <span class="c" id="todo-count"></span>
      <button class="go" id="todo-toggle" title="show or hide done items">show done</button>
    </div>
    <div class="list" id="todo-list"></div>
    <form id="todo-composer">
      <input id="todo-input" type="text" placeholder="Add a to-do…" autocomplete="off" spellcheck="false">
    </form>
  </aside>

  <main class="chat" id="chat"></main>

  <!-- -------------------------------------------------------- browse views -->

  <div class="browse" id="browse" hidden>
    <aside class="glass pane list-pane">
      <div class="rh">
        <span class="n" id="browse-title">Chats</span>
        <span class="c" id="browse-count"></span>
      </div>
      <input id="browse-search" type="search" placeholder="Search…" autocomplete="off" spellcheck="false">
      <div class="list" id="browse-list"></div>
    </aside>
    <div class="spacer"></div>
    <article class="glass pane read-pane" id="browse-read"></article>
  </div>

  <div class="dock">
    <button class="pill" data-cmd="chat">Discuss</button>
    <button class="pill" data-cmd="note">Take notes</button>
    <form id="composer">
      <input id="input" type="text" placeholder="Type instead…" autocomplete="off" spellcheck="false">
    </form>
  </div>

  <script src="/app.js"></script>
</body>
</html>
